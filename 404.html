:root{
  --navy:#051D41; --navy-mid:#0A2B5C; --navy-lift:#10397A; --navy-press:#02101F;
  --ink:#132845; --muted:#5A6B85;
  --gold:#C9A227; --gold-soft:#E9C45A; --sand:#F0C79A;
  --cream:#FFFDF8; --cream-deep:#F5F0E6; --clay:#EAE1D1;
  --line:rgba(5,29,65,.12); --line-l:rgba(255,255,255,.16);
  --pad:7rem; --wrap:1200px;
  --f-title:'Cinzel Decorative','Iowan Old Style',Georgia,serif;
  --f-body:'Lato',system-ui,sans-serif;
  --f-sub:'Syne Mono',ui-monospace,monospace;
  --f-name:'Caacupe One','Lato',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--f-body);
  font-size:1.28rem;line-height:1.72;text-rendering:geometricPrecision;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,.disp{font-family:var(--f-title);font-weight:700;margin:0;color:var(--navy);line-height:1.05;letter-spacing:0}
h1{font-size:clamp(2.5rem,5.6vw,4.6rem)}
h2{font-size:clamp(2rem,3.9vw,3.2rem)}
h3{font-size:clamp(1.4rem,2.2vw,1.9rem);line-height:1.15}
p{margin:0 0 1.4rem}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 2rem}
.section{padding:var(--pad) 0}
.lede{max-width:54ch;margin-top:1.5rem;font-size:1.12rem;color:var(--muted);font-family:var(--f-sub);line-height:1.65}
.mono{font-family:var(--f-sub)}
.dark{background:var(--navy);color:#fff}
.dark h1,.dark h2,.dark h3{color:#fff}
.on-dark,.on-dark p,.on-dark .disp{color:#fff}
.on-dark .lede{color:rgba(255,255,255,.78)}
.on-dark .stat{background:transparent;box-shadow:none;border-left:3px solid var(--gold)}
.on-dark .stat .n{color:var(--gold-soft)}
.on-dark .stat .l{color:rgba(255,255,255,.72)}
.on-dark .stat .ic{display:none}
.on-dark .acc{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.28);box-shadow:none}
.on-dark .acc .nm{color:rgba(255,255,255,.8)}
.on-dark .acc .num{color:var(--gold-soft)}
.on-dark .tst{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.18);box-shadow:none;color:#fff}
.on-dark .tst h4,.on-dark .tst .uni,.on-dark .tst .fold{color:#fff}
.on-dark .tst .ctry,.on-dark .tst .q{color:rgba(255,255,255,.8)}
.on-dark .svc-panel{background:rgba(255,255,255,.05);box-shadow:none}
.on-dark .svc-copy h3{color:#fff}.on-dark .svc-copy p{color:rgba(255,255,255,.8)}
.on-dark .svc-tab{background:rgba(255,255,255,.12);color:#fff}
.on-dark .svc-tab.active{background:var(--gold-soft);color:var(--navy)}
.on-dark .chips span{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.on-dark .acc-fade{background:none}
.dark .lede{color:rgba(255,255,255,.78)}
.band{background:var(--cream-deep)}
.light-sec{background:var(--cream)}
.bn{font-family:'Noto Serif Bengali',serif}
.rv{opacity:1;transform:none}
.slot{border:1px dashed rgba(5,29,65,.28);background:var(--clay);display:grid;place-items:center;
  color:#8A7C63;font-size:.95rem;text-align:center;padding:1.4rem}
.slot-d{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:rgba(255,255,255,.6)}

/* ---------- buttons with shimmer ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:.6rem;border-radius:6px;
  padding:1rem 2.1rem;font-weight:700;font-size:1.05rem;text-decoration:none;white-space:nowrap;border:0;cursor:pointer;
  font-family:var(--f-sub);letter-spacing:.01em;
  transition:transform .2s,background .25s,color .25s,box-shadow .2s}
.btn:hover{transform:translate(3px,3px)}
.btn.sheen:after{content:"";position:absolute;top:-20%;left:-130%;width:55%;height:140%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-22deg);animation:sheen 3.8s ease-in-out infinite}
@keyframes sheen{0%{left:-130%}45%{left:130%}100%{left:130%}}
.btn-gold{background:var(--gold-soft);color:var(--navy);box-shadow:7px 7px 0 var(--navy)}
.btn-gold:hover{box-shadow:4px 4px 0 var(--navy)}
.btn-clay{background:var(--navy-mid);color:#fff;box-shadow:7px 7px 0 var(--gold-soft)}
.btn-clay:hover{box-shadow:4px 4px 0 var(--gold-soft)}
.btn-clay.sheen:after{background:linear-gradient(100deg,transparent,rgba(233,196,90,.45),transparent)}
.btn-out{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.45);box-shadow:7px 7px 0 rgba(255,255,255,.18)}
.btn-out:hover{box-shadow:4px 4px 0 rgba(255,255,255,.18)}
.btn-out:hover{background:rgba(255,255,255,.1)}
.btn-navy{background:var(--navy);color:var(--cream);box-shadow:7px 7px 0 var(--gold-soft)}
.btn-navy:hover{box-shadow:4px 4px 0 var(--gold-soft)}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);box-shadow:6px 6px 0 rgba(5,29,65,.18)}
.btn-ghost:hover{box-shadow:3px 3px 0 rgba(5,29,65,.18)}
.btn-ghost:hover{background:var(--navy);color:#fff}
.btn-sm{padding:.6rem 1.2rem;font-size:.9rem;box-shadow:5px 5px 0 currentColor}
.btn-gold.btn-sm{box-shadow:5px 5px 0 var(--navy)}.btn-gold.btn-sm:hover{box-shadow:3px 3px 0 var(--navy)}
.btn-out.btn-sm{box-shadow:5px 5px 0 rgba(255,255,255,.18)}.btn-out.btn-sm:hover{box-shadow:3px 3px 0 rgba(255,255,255,.18)}
.btn-ghost.btn-sm{box-shadow:5px 5px 0 rgba(5,29,65,.18)}.btn-ghost.btn-sm:hover{box-shadow:3px 3px 0 rgba(5,29,65,.18)}
.btn-navy.btn-sm{box-shadow:5px 5px 0 var(--gold-soft)}.btn-navy.btn-sm:hover{box-shadow:3px 3px 0 var(--gold-soft)}

/* ---------- opening animation ----------
   Dream, Apply, Fly, then the logo. 1150ms in total, then it lifts away.
   The words turn like a cube face and the navy deepens and lifts behind them. */
html.pl-lock,html.pl-lock body{overflow:hidden}
.pl{position:fixed;inset:0;z-index:300;display:grid;place-items:center;background:#051D41;
  animation:pl-bg 2100ms ease-in-out both,pl-out 380ms cubic-bezier(.4,0,.2,1) 2100ms forwards}
@keyframes pl-bg{
  0%{background-color:#051D41}
  32%{background-color:#0A2B5C}
  62%{background-color:#10397A}
  100%{background-color:#061F45}}
@keyframes pl-out{to{opacity:0;visibility:hidden}}
.pl-stage{position:relative;width:min(92vw,900px);height:3.2em;perspective:1000px;overflow:hidden;
  font-family:var(--f-title);font-size:clamp(2.4rem,8.5vw,5.2rem);line-height:1.3;text-align:center}
.pl-word,.pl-final{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#FFFDF8;opacity:0;will-change:transform,opacity}
.pl-final{gap:.34em;flex-wrap:nowrap;padding:0 .4em}
.pl-word:after{content:".";color:var(--gold-soft)}
@keyframes pl-up{
  0%{opacity:0;transform:translateY(90%)}
  22%{opacity:1;transform:none}
  70%{opacity:1;transform:none}
  100%{opacity:0;transform:translateY(-70%)}}
@keyframes pl-left{
  0%{opacity:0;transform:translateX(75%)}
  22%{opacity:1;transform:none}
  70%{opacity:1;transform:none}
  100%{opacity:0;transform:translateX(-60%)}}
@keyframes pl-right{
  0%{opacity:0;transform:translateX(-75%)}
  22%{opacity:1;transform:none}
  70%{opacity:1;transform:none}
  100%{opacity:0;transform:translateX(60%)}}
@keyframes pl-land{
  0%{opacity:0;transform:translateY(-80%)}
  60%{opacity:1;transform:translateY(4%)}
  100%{opacity:1;transform:none}}
.pl-w1{animation:pl-up 560ms cubic-bezier(.3,.8,.3,1) 0ms both}
.pl-w2{animation:pl-left 560ms cubic-bezier(.3,.8,.3,1) 500ms both}
.pl-w3{animation:pl-right 560ms cubic-bezier(.3,.8,.3,1) 1000ms both}
.pl-final{animation:pl-land 520ms cubic-bezier(.2,.75,.3,1) 1560ms both}
.pl-final img{height:clamp(78px,20vw,140px);width:auto;max-height:80%;flex:0 0 auto}
.pl-name{font-family:var(--f-title);font-weight:700;letter-spacing:.01em;white-space:nowrap}
.pl-name em{font-style:normal;color:var(--gold-soft)}
@media (prefers-reduced-motion:reduce){.pl{display:none}}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:70;background:rgba(5,29,65,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-l)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:1.4rem;max-width:var(--wrap);margin:0 auto;padding:.85rem 2rem}
.brand{display:flex;align-items:center;gap:.8rem;text-decoration:none}
.brand .mark{height:50px;display:flex;align-items:center}
.brand .mark img{height:50px;width:auto}
.brand .mark .slot{height:50px;width:120px;font-size:.62rem;padding:.2rem}
.brand b{font-family:var(--f-title);font-weight:700;font-size:1.35rem;color:#fff;display:block;line-height:1;margin-bottom:1px}
.brand b em{font-style:normal;color:var(--gold-soft)}
.brand i{font-style:normal;font-size:.72rem;color:var(--gold-soft);letter-spacing:.05em;font-family:var(--f-sub);display:block;line-height:1}
.top-right{display:flex;align-items:center;gap:.9rem}
.dots{width:40px;height:34px;border:0;background:none;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:7px;transition:opacity .2s}
.dots:hover span{background:#fff}
.dots span{width:28px;height:2px;border-radius:1px;background:#fff;display:block}
.dots span:nth-child(2){width:20px}

/* ---------- sidebar ---------- */
.scrim{position:fixed;inset:0;background:rgba(2,16,31,.55);z-index:80;opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.open{opacity:1;pointer-events:auto}
.side{position:fixed;top:0;right:0;height:100%;width:min(430px,90vw);background:var(--cream);z-index:90;
  transform:translateX(105%);transition:transform .45s cubic-bezier(.22,.7,.3,1);overflow-y:auto;box-shadow:-20px 0 60px rgba(2,16,31,.3)}
.side.open{transform:none}
.side-in{padding:2.4rem 2rem 4rem}
.side h4{font-size:.98rem;font-family:var(--f-sub);font-weight:400;color:var(--gold);margin:2rem 0 .7rem;letter-spacing:.04em}
.side a{display:block;text-decoration:none;font-size:1.2rem;padding:.5rem 0;border-bottom:1px solid var(--line)}
.side a:hover{color:var(--gold)}
.side .close{float:right;background:none;border:0;font-size:2rem;cursor:pointer;color:var(--navy);line-height:1}

/* ---------- hero ---------- */
.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden;padding:5.5rem 0 5rem}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--navy) 8%,rgba(5,29,65,.72) 60%,rgba(5,29,65,.45));z-index:1}
.hero-in{position:relative;z-index:3}
.hero-in>div{max-width:900px}
.hero h1{color:#fff;line-height:1.08}
.hero h1 em{font-style:normal;color:var(--gold-soft)}
.hero p{color:rgba(255,255,255,.82);font-size:1.36rem;max-width:44ch;margin-top:1.8rem}
.hero-btns{display:flex;gap:1rem;flex-wrap:wrap;margin-top:2.6rem}
.hero-foot{margin-top:3.2rem;display:flex;gap:2.2rem;flex-wrap:wrap;font-size:1rem;color:rgba(255,255,255,.6)}
.hero-foot b{color:#fff}
.hero-art{aspect-ratio:3/4;border-radius:48% 52% 60% 40% / 42% 44% 56% 58%;overflow:hidden}
.hero-art img{width:100%;height:100%;object-fit:cover}

/* ---------- solid dividers ---------- */
.divider{padding:3.2rem 0}
.divider .wrap{display:flex;align-items:center;justify-content:space-between;gap:2rem;flex-wrap:wrap}
.divider .disp{font-size:clamp(1.7rem,3.4vw,2.8rem)}
.div-gold{background:var(--gold-soft)}
.div-gold .disp{color:var(--navy)}
.div-sand{background:var(--sand)}
.div-sand .disp{color:var(--navy)}
.div-navy{background:var(--navy)}
.div-navy .disp{color:#fff}

/* ---------- neumorphic stats ---------- */
.neu-wrap{background:var(--cream-deep);padding:var(--pad) 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2rem;margin-top:3rem}
.stat{display:block;text-decoration:none;color:inherit;background:var(--cream-deep);border-radius:30px;padding:2.4rem 2rem;
  box-shadow:14px 14px 30px rgba(5,29,65,.13),-12px -12px 26px rgba(255,255,255,.95);transition:box-shadow .4s,transform .4s}
.stat:hover{transform:translateY(-6px);box-shadow:18px 18px 36px rgba(5,29,65,.16),-14px -14px 30px #fff}
.stat .ic{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;margin-bottom:1.2rem;
  background:var(--cream-deep);box-shadow:inset 5px 5px 10px rgba(5,29,65,.14),inset -5px -5px 10px #fff}
.stat .ic svg{width:26px;height:26px;stroke:var(--gold);fill:none;stroke-width:2}
.stat .n{font-family:var(--f-title);font-weight:700;font-size:2.9rem;line-height:1;color:var(--navy)}
.stat .l{font-size:.98rem;color:var(--muted);margin-top:.5rem;line-height:1.45;font-family:var(--f-sub)}

/* ---------- countries ---------- */
.countries{background:var(--navy);padding:var(--pad) 0;position:relative;overflow:hidden}
.countries h2{color:#fff}
.marquee{overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.mq-row{display:flex;gap:1.1rem;width:max-content;animation:slide var(--dur,40s) linear infinite}
.marquee:hover .mq-row,.marquee:hover .ig-row{animation-play-state:paused}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ctry-cloud{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.6rem 1.6rem;margin-top:3rem}
.cpill{display:inline-flex;align-items:baseline;gap:.6rem;color:#fff;text-decoration:none;cursor:pointer;
  font-family:var(--f-name);line-height:1;padding:.2rem .3rem;
  transition:color .3s,transform .3s}
.cpill:hover{color:var(--gold-soft);transform:translateY(-4px) rotate(0deg)}
.cpill .fl{line-height:1}
.cpill .fl img{width:34px;height:24px;object-fit:cover;border-radius:3px;display:block}

/* ---------- acceptances ---------- */
.acc-shell{position:relative;margin-top:3.5rem}
.acc-fade{display:none}
.acc-shell.collapsed .acc-fade{display:block;position:absolute;left:0;right:0;bottom:0;height:90px;
  background:linear-gradient(rgba(255,253,248,0),var(--cream));pointer-events:none}
.acc-shell.collapsed .acc.acc-peek{height:46px;overflow:hidden;opacity:.45}
.acc-shell.collapsed .acc.acc-hide{display:none}
.acc-more{display:none;margin-top:1.6rem}
.acc-more.on{display:inline-flex}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:1.2rem}
.acc{display:flex;align-items:center;gap:1rem;padding:1.6rem 1.6rem;border-radius:28px;background:var(--cream-deep);
  border:2px dashed rgba(5,29,65,.22);
  box-shadow:14px 14px 30px rgba(5,29,65,.13),-12px -12px 26px rgba(255,255,255,.95),inset 1px 1px 3px rgba(255,255,255,.6);
  transition:transform .35s,box-shadow .35s,border-color .35s}
.acc:hover{transform:translateY(-6px);
  box-shadow:18px 18px 36px rgba(5,29,65,.16),-14px -14px 30px #fff}
.acc .fl{font-size:1.8rem;line-height:1}
.acc .nm{flex:1;font-size:1.02rem;line-height:1.35;color:var(--muted)}
.acc .num{font-family:var(--f-title);font-weight:700;font-size:1.9rem;color:var(--navy);line-height:1}
.acc.has-bg{background-size:cover;background-position:center;position:relative;overflow:hidden;
  border-color:rgba(255,255,255,.35);box-shadow:14px 14px 30px rgba(5,29,65,.2)}
.acc.has-bg .veil{position:absolute;inset:0;background:var(--navy);z-index:0}
.acc.has-bg .fl,.acc.has-bg .nm,.acc.has-bg .num{position:relative;z-index:1}
.acc.has-bg .nm,.on-dark .acc.has-bg .nm{color:#fff;font-weight:600;text-shadow:0 1px 4px rgba(2,16,31,.9)}
.acc.has-bg .num,.on-dark .acc.has-bg .num{color:var(--gold-soft);text-shadow:0 1px 4px rgba(2,16,31,.9)}
.acc.has-bg .fl{text-shadow:0 1px 4px rgba(2,16,31,.7)}

a.acc{text-decoration:none;cursor:pointer}

/* ---------- video ---------- */
.video{position:relative;border-radius:34px;overflow:hidden;margin-top:3rem;background:var(--navy-mid);
  box-shadow:18px 18px 40px rgba(2,16,31,.5),-14px -14px 34px var(--navy-lift);aspect-ratio:16/9}
.video iframe,.video img{width:100%;height:100%;border:0;display:block;object-fit:cover}
.video .play{position:absolute;inset:0;display:grid;place-items:center;cursor:pointer;background:rgba(5,29,65,.3)}
.video .play i{width:88px;height:88px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center;
  font-style:normal;color:var(--navy);font-size:1.8rem;padding-left:6px;box-shadow:0 14px 34px rgba(0,0,0,.35)}

/* ---------- featured post ---------- */
.feat{display:grid;grid-template-columns:1.05fr 1fr;gap:3rem;align-items:center;margin-top:3rem}
.blog-row{display:flex;gap:1rem;flex-wrap:wrap;margin-top:2rem;align-items:center}
.feat .cover{aspect-ratio:16/11;max-height:340px;border-radius:46% 54% 60% 40% / 42% 44% 56% 58%;overflow:hidden}
.feat .cover img{width:100%;height:100%;object-fit:cover}
.feat .cat{color:var(--gold);font-size:1rem;margin-bottom:.7rem}

/* ---------- instagram ---------- */
.ig-wrap{background:var(--navy);padding:var(--pad) 0;overflow:hidden}
.ig-row{display:flex;gap:1.6rem;width:max-content}
.ig-scroll{overflow-x:auto;scrollbar-width:none;cursor:grab;scroll-behavior:auto;overscroll-behavior-x:contain}
.ig-scroll::-webkit-scrollbar{display:none}
.ig-scroll.manual{cursor:grabbing}

.ig{width:334px;background:#fff;border-radius:14px;overflow:hidden;color:#111;box-shadow:0 18px 40px rgba(0,0,0,.34);flex:0 0 auto}
.ig-head{display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem}
.ig-head .pfp{width:38px;height:38px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#F9CE34,#EE2A7B,#6228D7);flex:0 0 38px}
.ig-head .pfp img{width:100%;height:100%;border-radius:50%;border:2px solid #fff;object-fit:cover;display:block}
.ig-head .who{flex:1;line-height:1.2}
.ig-head .who b{font-size:.9rem;font-weight:600;display:block}
.ig-head .who small{font-size:.75rem;color:#666}
.ig-head .more{color:#333;font-size:1.1rem;letter-spacing:1px}
.ig-photo{aspect-ratio:4/5;background:#EFEAE0;display:grid;place-items:center;color:#8A7C63;font-size:.85rem;text-align:center;padding:1.4rem;overflow:hidden}
.ig-photo.has-img{padding:0;display:block}
.ig-photo img{display:block;width:100%;height:100%;object-fit:cover}
.ig-acts{display:flex;align-items:center;gap:.85rem;padding:.7rem .8rem .2rem}
.ig-acts img{height:22px;width:auto;display:block}
.ig-acts .save{margin-left:auto}
.ig-body{padding:.1rem .85rem 1rem;font-size:.86rem;line-height:1.5}
.ig-body .likes{font-weight:600;margin:.15rem 0 .3rem}
.ig-body .cap b{font-weight:600}
.ig-body .date{color:#8E8E8E;font-size:.72rem;text-transform:uppercase;letter-spacing:.02em;margin-top:.5rem}

/* ---------- services tabs ---------- */
.svc-tabs{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:3rem}
.svc-tab{padding:.85rem 1.5rem;border-radius:6px;border:0;cursor:pointer;font-family:var(--f-sub);font-size:1rem;font-weight:400;
  background:var(--clay);color:var(--navy);transition:background .3s,color .3s,transform .3s}
.svc-tab:hover{transform:translateY(-2px)}
.svc-tab.active{background:var(--navy);color:#fff}
.svc-panel{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:2.5rem;background:var(--cream);
  border-radius:34px;overflow:hidden;box-shadow:16px 18px 40px rgba(5,29,65,.1),-10px -10px 26px #fff}
.svc-copy{padding:3.4rem 3rem}
.svc-copy h3{font-size:clamp(1.8rem,3.2vw,2.6rem);margin-bottom:1.2rem}
.svc-copy p{color:var(--muted);font-size:1.12rem}
.chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.6rem}
.chips span{background:var(--cream-deep);border:1px solid var(--line);border-radius:6px;padding:.5rem 1rem;font-size:.92rem;font-family:var(--f-sub)}
.svc-art{position:relative;min-height:380px;background:var(--sand);overflow:hidden}
.svc-art .blk{position:absolute}
.svc-art .b1{left:0;top:0;width:42%;height:34%;background:var(--gold)}
.svc-art .b2{left:16%;top:16%;right:6%;bottom:0;background:var(--navy)}
.svc-art .b3{right:0;top:52%;width:14%;height:28%;background:var(--gold)}
.svc-art img{position:absolute;left:16%;top:16%;right:6%;bottom:0;width:auto;height:auto;object-fit:cover}
.svc-art .word{position:absolute;left:19%;bottom:.6rem;right:7%;color:#fff;font-weight:700;font-family:var(--f-title);
  font-size:clamp(2rem,4vw,3.2rem);line-height:.9;z-index:3}
.svc-art .idx{position:absolute;left:19%;top:20%;color:rgba(255,255,255,.18);font-family:var(--f-title);font-size:9rem;line-height:1;z-index:2}

/* ---------- one blog post ---------- */
.post-head{background:var(--navy);color:#fff;padding:4rem 0 3.4rem}
.post-head .back-link{color:var(--gold-soft);font-family:var(--f-sub);font-size:.95rem;text-decoration:none;
  display:inline-block;margin-bottom:2rem}
.post-head .back-link:hover{color:#fff}
.post-head .cat{color:var(--gold);font-family:var(--f-sub);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase}
.post-head h1{color:#fff;font-size:clamp(2.2rem,5.4vw,4rem);margin-top:.9rem;line-height:1.12}
.post-head p{color:rgba(255,255,255,.78);max-width:58ch;margin-top:1.3rem;font-size:1.12rem}
.post-cover{margin-top:-2.6rem;border-radius:28px;overflow:hidden;box-shadow:16px 16px 34px rgba(5,29,65,.18);
  aspect-ratio:16/8;max-height:520px}
.post-cover img{width:100%;height:100%;object-fit:cover;display:block}
.post-cover:empty{display:none}
.post-body{max-width:70ch;font-size:1.12rem;line-height:1.85;color:var(--ink)}
.post-body p{margin:0 0 1.4rem}
.post-body p:last-child{margin-bottom:0}
.blog-grid a.post{text-decoration:none;color:inherit;display:block}
.loading-note{color:var(--muted);font-family:var(--f-sub);font-size:1.02rem;padding:1.4rem 0}
.on-dark .loading-note{color:rgba(255,255,255,.7)}

.faq{margin-top:2.5rem}
.faq details{border-bottom:1px solid var(--line);padding:1.3rem 0}
.faq summary{cursor:pointer;font-size:1.15rem;color:var(--navy);font-weight:700;list-style:none;font-family:var(--f-body)}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";float:right;color:var(--gold);font-size:1.5rem;line-height:1}
.faq details[open] summary:after{content:"\2013"}
.faq p{margin:1rem 0 0;font-size:1.05rem;color:var(--muted)}
.on-dark .faq summary{color:#fff}
.on-dark .faq p{color:rgba(255,255,255,.78)}
.on-dark .faq details{border-color:rgba(255,255,255,.18)}

/* ---------- contact form ---------- */
.lead-form{margin-top:2rem;display:grid;gap:1rem;max-width:520px}
.lead-form input,.lead-form textarea{width:100%;padding:.9rem 1rem;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--ink);font-family:var(--f-body);font-size:1.02rem}
.lead-form input:focus,.lead-form textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.lead-form .err{color:#B3261E;font-size:.92rem;margin:.2rem 0 0;display:none}
.lead-form .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.lead-note{font-size:.95rem;color:var(--muted);margin:.6rem 0 0}

/* ---------- cookie banner ---------- */
.cookie{position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:110;background:var(--navy);color:#fff;
  border-radius:10px;padding:1.1rem 1.2rem;display:none;gap:1rem;align-items:center;flex-wrap:wrap;
  box-shadow:0 14px 34px rgba(2,16,31,.4);max-width:760px;margin:0 auto}
.cookie.show{display:flex}
.cookie p{margin:0;font-size:.98rem;flex:1 1 260px;color:rgba(255,255,255,.86)}
.cookie a{color:var(--gold-soft)}

/* ---------- legal pages ---------- */
.legal{max-width:820px}
.legal p{font-size:1.05rem;color:var(--muted)}
.legal h3{margin:2rem 0 .6rem}

/* ---------- verified tick ---------- */
.ig-head .who b{display:flex;align-items:center;gap:4px}
.vtick{width:10px;height:10px;flex:0 0 10px;display:block}

/* ---------- statistics icons ---------- */
.stat .ic img{width:30px;height:30px;object-fit:contain;display:block}

/* ---------- still being built ---------- */
.soon-sec{background:var(--cream)}
.soon{max-width:660px;margin:0 auto;text-align:center}
.soon .compass{margin:0 auto 2rem;display:block}
.soon .eyebrow{font-family:var(--f-sub);font-size:.9rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.soon h2{font-size:clamp(2.2rem,5.4vw,3.3rem);margin-top:1rem;line-height:1.1}
.soon .which{font-family:var(--f-name);font-size:1.5rem;color:var(--navy);margin-top:.9rem}
.soon .rule{width:84px;height:2px;background:var(--gold);margin:1.9rem auto}
.soon p{color:var(--muted);font-size:1.1rem;max-width:34em;margin:0 auto}
.soon .acts{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap;margin-top:2.4rem}

/* ---------- experts ---------- */
.member.expert{background:var(--cream-deep);border-left:3px solid var(--gold)}

/* ---------- testimonials ---------- */
.tst-shell{position:relative;margin-top:3.5rem}
.tst-fade{display:none}
.tst-more{display:none;margin-top:1.4rem}
.tst-row{display:flex;gap:1.2rem;align-items:stretch;min-height:340px}
.tst{background:var(--cream);border-radius:8px;padding:1.6rem;border:1px solid var(--line);cursor:pointer;overflow:hidden;
  box-shadow:10px 10px 0 rgba(5,29,65,.08);flex:0 0 86px;display:flex;align-items:center;justify-content:center;
  position:relative;transition:flex-basis .55s cubic-bezier(.22,.7,.3,1),background .4s}
.tst .tbg{position:absolute;inset:0;background-size:cover;background-position:center;pointer-events:none;z-index:0;transition:opacity .4s}
.tst .tbg.full-bg{display:none}
.tst.open .tbg.fold-bg{display:none}
.tst.open .tbg.full-bg{display:block;
  -webkit-mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,1) 100%);
  mask-image:linear-gradient(to right,rgba(0,0,0,0) 0%,rgba(0,0,0,1) 100%)}
.tst .fold,.tst .full{position:relative;z-index:1}
.tst.open .full{background:rgba(255,253,248,var(--tst-panel,.88));border-radius:10px;padding:1.1rem 1.2rem;
  animation:tstIn 520ms cubic-bezier(.22,.7,.3,1) both}
@keyframes tstIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.tst.open{flex:1 1 auto;background:var(--cream-deep);padding:2.4rem;display:block}
.tst .fold{writing-mode:vertical-rl;font-family:var(--f-sub);font-size:1.02rem;color:var(--navy);
  white-space:nowrap;letter-spacing:.04em}
.tst .fold b{font-family:var(--f-name);font-weight:400;font-size:1.5rem}
.tst.open .fold{display:none}
.tst .full{display:none;min-width:320px}
.tst.open .full{display:block}
.tst .who{display:flex;align-items:center;gap:1.1rem;margin-bottom:1.4rem}
.tst .por{width:88px;height:110px;flex:0 0 88px;overflow:hidden;border-radius:46% 54% 62% 38% / 40% 44% 56% 60%}
.tst .por img{width:100%;height:100%;object-fit:cover}
.tst .por.slot{font-size:.7rem;padding:.4rem}
.tst h4{font-size:1.4rem;font-family:var(--f-name)}
.tst .uni{font-size:1rem;color:var(--navy);font-weight:700;margin:.2rem 0 0}
.tst .ctry{font-size:.95rem;color:#3C4C66;margin:0}
.tst h4{color:var(--navy)}
.tst p.q{font-size:1.08rem;color:#0C1E3A;margin:0;font-style:italic;font-weight:500}

/* ---------- tools page ---------- */
#vTools .section{background:var(--navy)}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.8rem;margin-top:1rem}
.tool{display:block;text-decoration:none;background:var(--navy-mid);color:#fff;border-radius:28px;padding:2.4rem 2rem;
  box-shadow:12px 12px 26px var(--navy-press),-10px -10px 24px var(--navy-lift),inset 1px 1px 5px rgba(255,255,255,.07);transition:transform .35s}
.tool:hover{transform:translateY(-8px)}
.tool h3{color:var(--gold-soft);font-size:1.6rem;margin-bottom:.5rem}
.tool p{color:rgba(255,255,255,.78);font-size:1.02rem;margin:0}
.tool .go{display:block;margin-top:1.4rem;color:var(--gold-soft);font-size:.98rem}

/* ---------- team and blog ---------- */
.founder-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2.4rem;margin-top:3rem}
.founder{background:var(--cream-deep);border-radius:28px;padding:2rem;
  box-shadow:16px 16px 34px rgba(5,29,65,.14),-14px -14px 30px rgba(255,255,255,.95);transition:transform .4s}
.founder:hover{transform:translateY(-8px)}
.founder .ph{aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--clay);
  box-shadow:inset 6px 6px 14px rgba(5,29,65,.16),inset -6px -6px 14px rgba(255,255,255,.8)}
.founder .ph img{width:100%;height:100%;object-fit:cover}
.founder h3{font-size:1.7rem;margin-top:1.6rem;font-family:var(--f-name)}
.founder .role{font-family:var(--f-sub);color:var(--gold);font-size:1rem;margin:.3rem 0 1rem}
.founder p{color:var(--muted);font-size:1.02rem;margin:0}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2rem;margin-top:3rem}
.member{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:1.8rem;box-shadow:10px 10px 0 rgba(5,29,65,.07)}
.member .ph{aspect-ratio:3/4;border-radius:44% 56% 62% 38% / 40% 42% 58% 60%;overflow:hidden;max-width:190px}
.member .ph img{width:100%;height:100%;object-fit:cover}
.member h3{font-size:1.3rem;margin-top:1.2rem;font-family:var(--f-name)}
.member .role{color:var(--gold);font-family:var(--f-sub);font-size:.95rem;margin:.2rem 0 .6rem}
.member p{color:var(--muted);font-size:1rem;margin:0}
.blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2rem;margin-top:3rem}
.post{background:var(--cream);border:1px solid var(--line);border-radius:28px;overflow:hidden;transition:transform .4s}
.post:hover{transform:translateY(-8px)}
.post .cover{aspect-ratio:16/10}
.post .cover img{width:100%;height:100%;object-fit:cover}
.post .body{padding:1.7rem 1.7rem 2rem}
.post .cat{font-size:.9rem;color:var(--gold);margin-bottom:.5rem}
.post h3{font-size:1.3rem;margin-bottom:.6rem}
.post p{font-size:1rem;color:var(--muted);margin:0}

/* ---------- footer ---------- */
.foot-banner{background:var(--navy-press);padding:0 0 0}
.foot-banner .slot{height:220px;margin:0 2rem;border-radius:24px}
footer{background:var(--navy-press);color:rgba(255,255,255,.72);padding:2.8rem 0 1.8rem;font-size:1rem}
.foot-links{display:grid;grid-template-columns:1fr 1fr;gap:0 1.2rem}
.foot-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:3rem}
footer h4{font-family:var(--f-sub);font-size:.98rem;font-weight:400;color:var(--gold-soft);margin:0 0 1rem;letter-spacing:.04em}
footer a{color:rgba(255,255,255,.72);text-decoration:none;display:block;padding:.18rem 0}
footer a:hover{color:#fff}
.foot-logo{height:56px;margin-bottom:1.2rem}
.foot-logo-slot{height:70px;width:200px;margin-bottom:1.2rem;border-radius:14px}
.socials{display:flex;gap:.8rem;margin-top:1.4rem}
.socials a{width:52px;height:52px;border-radius:50%;background:var(--navy-mid);display:grid;place-items:center;
  border:1px solid var(--line-l);padding:0;transition:transform .3s,background .3s}
.socials a:hover{transform:translateY(-4px);background:var(--navy-lift)}
.socials img{height:24px;width:auto}
.maplink{display:block;margin:0 0 1rem;text-decoration:none;padding:0}
.maplink img,.mapslot{display:block;width:100%;max-width:280px;height:120px;object-fit:cover;border-radius:8px;
  border:1px solid var(--line-l);font-size:.8rem}
.mapcta{display:inline-block;margin-top:.5rem;color:var(--gold-soft);font-family:var(--f-sub);font-size:.92rem}
.foot-base{border-top:1px solid var(--line-l);margin-top:2rem;padding-top:1.4rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-size:.95rem}

/* views */
.view{display:none}.view.active{display:block}
.page-head{background:var(--navy);color:#fff;padding:5rem 0 4rem}
.page-head h1{color:#fff;font-size:clamp(2.8rem,6.5vw,5rem)}
.page-head p{color:rgba(255,255,255,.75);max-width:54ch;margin-top:1.4rem;font-family:var(--f-sub);font-size:1.08rem}

/* admin */
.admin{position:fixed;inset:0;background:var(--cream);z-index:120;overflow-y:auto;display:none}
.admin.open{display:block}
.abar{position:sticky;top:0;background:var(--navy);color:#fff;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;z-index:2}
.abar h3{color:var(--gold-soft);font-size:1.5rem}
.ain{max-width:1020px;margin:0 auto;padding:2.5rem 2rem 6rem}
.alayout{display:grid;grid-template-columns:250px 1fr;gap:2.4rem;align-items:start}
.anav{position:sticky;top:90px;background:var(--cream-deep);border:1px solid var(--line);border-radius:16px;padding:1.2rem}
.anav h5{font-family:var(--f-sub);font-size:.85rem;color:var(--gold);margin:1.2rem 0 .5rem;font-weight:400;letter-spacing:.05em}
.anav h5:first-child{margin-top:0}
.tab{display:block;width:100%;text-align:left;padding:.6rem .9rem;border-radius:8px;border:0;background:transparent;
  cursor:pointer;font-family:inherit;font-size:1rem;color:var(--ink);margin-bottom:.2rem}
.tab:hover{background:var(--clay)}
.tab.active{background:var(--navy);color:#fff}
.pane h3{margin-bottom:1.2rem}
.pane{display:none}.pane.active{display:block}
.cardA{background:var(--cream-deep);border:1px solid var(--line);border-radius:22px;padding:1.8rem;margin-bottom:1.8rem}
.field{margin-bottom:1.1rem}
.field label{display:block;font-size:.95rem;color:var(--muted);margin-bottom:.35rem}
.field input,.field textarea,.field select{width:100%;padding:.8rem 1rem;font-family:inherit;font-size:1.02rem;
  border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 1.1rem;background:#fff;
  border:1px solid var(--line);border-radius:16px;margin-bottom:.7rem}
.row .t{flex:1;font-size:1.02rem}
.row .t small{display:block;color:var(--muted);font-size:.88rem}
.thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--clay)}
.login{max-width:420px;margin:12vh auto;background:var(--cream-deep);border:1px solid var(--line);border-radius:28px;padding:3rem 2.4rem;text-align:center}
.note{font-size:.95rem;color:var(--muted)}

/* ---------- admin on tablets and phones ---------- */
@media (max-width:1100px){
  .alayout{grid-template-columns:1fr;gap:1.2rem}
  .anav{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:.4rem;overflow-x:auto;white-space:nowrap;
    padding:.6rem .8rem;border-radius:0;border-left:0;border-right:0;-webkit-overflow-scrolling:touch}
  .anav::-webkit-scrollbar{height:0}
  .anav h5{margin:0 .5rem 0 .3rem;font-size:.72rem;opacity:.85;flex:0 0 auto}
  .anav h5:first-child{margin-left:0}
  .tab{display:inline-block;width:auto;flex:0 0 auto;margin:0;padding:.55rem 1rem;border-radius:999px;background:var(--cream)}
  .tab.active{background:var(--navy)}
  .ain{padding:1.4rem 1.1rem 5rem}
  .abar{position:static;padding:.8rem 1.1rem;gap:.6rem}
  .abar h3{font-size:1.2rem}
  .abar .btn-sm{padding:.5rem .9rem;font-size:.82rem;box-shadow:none}
  .cardA{padding:1.2rem;border-radius:16px}
  .cardA h3{font-size:1.4rem}
  .field input,.field textarea,.field select{font-size:16px;padding:.75rem .9rem}
  .row{flex-wrap:wrap;padding:.8rem .9rem}
  .row .t{flex:1 1 100%;font-size:.98rem}
  .row div[style*="display:flex"]{width:100%}
  .row .btn-sm{flex:1 1 auto;justify-content:center;box-shadow:none}
  .login{margin:8vh 1rem;padding:2.2rem 1.4rem}
  #syncState{flex:1 1 100%;order:9}
}
@media (max-width:980px){
  :root{--pad:4.5rem}
  body{font-size:1.16rem}
  .hero-in,.feat,.foot-grid,.svc-panel{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .hero-art{display:none}
  .svc-art{min-height:280px}
  .hero{padding:3.5rem 0 4rem}
}
@media (max-width:720px){
  :root{--pad:3.4rem}
  body{font-size:1.06rem}
  h1{font-size:clamp(1.9rem,7.4vw,2.7rem)}
  h2{font-size:clamp(1.6rem,6vw,2.2rem)}
  .wrap{padding:0 1.2rem}
  .lede{font-size:1.02rem}
  .top-in{padding:.65rem 1.1rem}
  .brand .mark img{height:38px}.brand b{font-size:1.3rem}
  #headCta{display:none}
  .dots{width:46px;height:46px}
  .side{width:100%}
  .hero{padding:1.8rem 0 2.2rem;min-height:0}
  .hero h1{font-size:clamp(1.75rem,6.6vw,2.3rem)}
  .hero p{font-size:1.02rem;margin-top:1.1rem}
  .hero .doodles{opacity:.35}
  .hero-btns{gap:.7rem 1rem;margin-top:1.6rem}
  .hero-btns .btn{flex:1 1 calc(50% - .6rem);width:auto;justify-content:center;text-align:center;
    white-space:normal;line-height:1.2;padding:.66rem .7rem;font-size:.84rem;box-shadow:4px 4px 0 var(--navy-press)}
  .hero-btns .btn-gold{box-shadow:4px 4px 0 var(--navy-press)}
  .hero-btns .btn-clay{box-shadow:4px 4px 0 var(--gold-soft)}
  .hero-foot{gap:.35rem;flex-direction:column;margin-top:1.6rem;font-size:.9rem}
  .divider{padding:1rem 0}
  .divider .wrap{flex-direction:row;align-items:center;justify-content:space-between;gap:.8rem;flex-wrap:wrap}
  .divider .disp{font-size:1.15rem}
  .div-sand{padding:1.4rem 0}
  .div-sand .disp{font-size:1.6rem}
  #contact{padding:2.2rem 0}
  #contact .lede{margin-top:.8rem}
  #contact .cta-pair{margin-top:1.2rem!important;gap:.7rem!important}
  #contact .bn{margin-top:1.2rem!important;font-size:1rem!important}
  .divider .wrap>div:last-child{font-size:.82rem}
  .stats{grid-template-columns:1fr 1fr;gap:.9rem}
  .stat{padding:1.1rem .9rem;border-radius:20px}
  .stat .ic{width:38px;height:38px;margin-bottom:.7rem}
  .stat .ic svg{width:19px;height:19px}
  .stat .n{font-size:1.9rem}
  .stat .l{font-size:.82rem;line-height:1.35}
  .acc-grid{grid-template-columns:1fr;gap:.9rem}
  .svc-tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:.7rem;-webkit-overflow-scrolling:touch}
  .svc-tab{flex:0 0 auto}
  .svc-copy{padding:2rem 1.4rem}
  .svc-art{min-height:104px;background:var(--clay)}
  .svc-art .b1{left:0;top:0;width:34%;height:100%}
  .svc-art .b2{left:26%;top:0;right:0;bottom:0}
  .svc-art .b3{display:none}
  .svc-art .idx{display:none}
  .svc-art .word{left:30%;right:1rem;bottom:auto;top:50%;transform:translateY(-50%);font-size:1.7rem}
  .svc-art img{left:26%;top:0;right:0;bottom:0}
  .svc-copy{padding:1.6rem 1.3rem}
  .chips span{font-size:.86rem;padding:.4rem .8rem}
  .svc-art .b1{background:var(--gold-soft)}
  .svc-art .b2{background:var(--sand)}
  .svc-art .b3{background:var(--gold)}
  .svc-art .word{color:var(--navy)}
  .svc-art .idx{color:rgba(5,29,65,.14)}
  .svc-panel{background:var(--cream);box-shadow:10px 10px 0 rgba(5,29,65,.07)}
  .tst{background:var(--cream)}
  .tst.open{background:var(--cream-deep)}
  .tst-row{flex-direction:column;gap:.9rem}
  .tst{flex:0 0 auto;padding:1.6rem}
  .tst.open .full{padding:1rem}
  .tst-shell.collapsed .tst:nth-child(n+5){display:none}
  .tst-shell.collapsed .tst:nth-child(4){max-height:46px;overflow:hidden;opacity:.5}
  .tst-shell.collapsed .tst-fade{display:block;position:absolute;left:0;right:0;bottom:0;height:70px;
    background:linear-gradient(rgba(255,253,248,0),var(--cream));pointer-events:none}
  .tst-more{display:inline-flex}
  .tst .fold{writing-mode:horizontal-tb;transform:none;height:auto;font-size:.98rem;white-space:normal}
  .tst .full{min-width:0}
  .ig{width:278px}
  .founder-grid{grid-template-columns:1fr}
  .team-grid{grid-template-columns:1fr 1fr;gap:1.2rem}
  .member{padding:1.2rem}
  .foot-grid{gap:1.6rem}
  .foot-links{gap:0 .8rem}
  footer{padding:2.2rem 0 1.4rem;font-size:.95rem}
  .foot-banner .slot{margin:0 1.2rem;height:150px}
  .video{border-radius:18px}
  .btn{padding:.95rem 1.6rem;font-size:1rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
